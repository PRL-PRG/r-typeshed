name: Notify r-typing

# A push to main changes the signatures the r-typing dashboard checks
# packages against: rerun it. Needs a PAT with `workflow` scope on
# PRL-PRG/r-typing stored here as PIPELINE_DISPATCH_TOKEN (as in tyr); until
# it exists the step fails without failing the workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger r-typing pipeline
        uses: peter-evans/repository-dispatch@v4
        continue-on-error: true
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: PRL-PRG/r-typing
          event-type: typeshed-updated
          client-payload: '{"typeshed":"${{ github.sha }}"}'
